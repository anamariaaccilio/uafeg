[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uafeg"
version = "0.1.0"
description = "Minimal EvidenceGraph MVP consuming the canonical baseline contract"
requires-python = ">=3.11"
dependencies = ["vehicle-claim-verification-baselines==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
